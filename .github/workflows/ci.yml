# SPEC-TOOLING-04 — Tích hợp liên tục bốn giai đoạn, có cổng chất lượng.
#
# Điều làm quy trình này khả thi: lớp cache khiến kết quả gọi model trở nên tất
# định. Tệp .cache/llm_cache.db được commit, nên runner đọc lại kết quả đã lưu
# mà không cần cài model và không cần card đồ họa.
#
# Đây là thực hành phân biệt kỹ thuật phần mềm AI với kỹ thuật phần mềm truyền
# thống: chất lượng model được kiểm soát tự động giống như kiểm soát lỗi biên dịch.
name: CI

on:
  push:
    branches: ["main", "team/**", "solution/**"]
  pull_request:
    branches: ["main"]
  # Chạy tay. Cần khi vừa sinh lại sáu nhánh cứu hộ: job matrix kiểm chúng
  # chỉ chạy trên main, nên sau khi đẩy nhánh phải kích hoạt lại để biết
  # chúng còn dùng được không.
  workflow_dispatch:

env:
  # Điều kiện then chốt: CI chạy ở chế độ chỉ dùng cache, nên không cần GPU,
  # không cần Ollama, không cần mạng tới server dùng chung.
  # Toàn bộ khả thi của cổng chất lượng tự động treo vào .cache/llm_cache.db.
  CACHE_MODE: cache_only
  CONFIG_PROFILE: L

jobs:
  # ── Giai đoạn 1 — Kiểm tra mã ──────────────────── bật từ Session 2 ──────
  lint:
    name: 1 · Kiểm tra mã
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Khóa cache theo pyproject.toml chứ không theo uv.lock: uv.lock chỉ
          # xuất hiện sau lần `uv sync` đầu tiên, và setup-uv sẽ hỏng ở bước
          # setup nếu tệp trong glob không tồn tại.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: Chặn dữ liệu nhạy cảm lọt vào repo
        run: |
          uv run python scripts/hook_no_real_pii.py $(git ls-files '*.py' '*.md' '*.json')
          uv run python scripts/hook_no_secrets.py $(git ls-files '*.py' '*.yml' '*.yaml' '*.env*')

  # ── Giai đoạn 2 — Kiểm thử ─────────────────────── bật từ Session 3 ──────
  test:
    name: 2 · Kiểm thử
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Khóa cache theo pyproject.toml chứ không theo uv.lock: uv.lock chỉ
          # xuất hiện sau lần `uv sync` đầu tiên, và setup-uv sẽ hỏng ở bước
          # setup nếu tệp trong glob không tồn tại.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-extras
      - name: Toàn vẹn bộ dữ liệu
        run: uv run python scripts/validate_data.py
      - name: pytest
        run: uv run pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest.xml

  # ── Giai đoạn 3 — Đánh giá rút gọn ─────────────── bật từ Session 5 ──────
  # Cổng chất lượng thực sự CHẶN merge, không chỉ in cảnh báo. Ngưỡng lấy từ
  # cột "Đạt" của SPEC-SCOPE-03 cho cấu hình tham chiếu.
  eval:
    name: 3 · Đánh giá rút gọn (cổng chất lượng)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Khóa cache theo pyproject.toml chứ không theo uv.lock: uv.lock chỉ
          # xuất hiện sau lần `uv sync` đầu tiên, và setup-uv sẽ hỏng ở bước
          # setup nếu tệp trong glob không tồn tại.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-extras
      - name: Kiểm tra tiền đề — cache đã được đóng băng chưa
        id: cache_check
        run: |
          if [ ! -f .cache/llm_cache.db ]; then
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Bỏ qua cổng chất lượng::Chưa có .cache/llm_cache.db"
            echo "Cổng chất lượng CHƯA hoạt động vì chưa có .cache/llm_cache.db."
            echo ""
            echo "Đây là mốc P2.5 trong docs/KE-HOACH-XAY-DUNG.md. Sinh trên máy có model:"
            echo "    uv run python scripts/warm_cache.py"
            echo "    git add .cache/llm_cache.db && git commit && git push"
            echo ""
            echo "Job này BỎ QUA thay vì chặn merge, vì thiếu tệp và chất lượng tụt là"
            echo "hai loại thất bại khác nhau. Gộp chúng lại là dạy cả đội bỏ qua cổng."
          else
            echo "has_cache=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Chạy đánh giá trên 15 ticket
        if: steps.cache_check.outputs.has_cache == 'true'
        run: uv run python eval/run_eval.py --quick --set train --out eval/results/ci.json
      - name: Đối chiếu ngưỡng chặn
        if: steps.cache_check.outputs.has_cache == 'true'
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path

          # CHƯA HIỆU CHUẨN LẠI: model mặc định đã đổi sang Qwen3-8B (xem
          # PROJECT-SPEC.md Mục 17 v1.6) nhưng ngưỡng dưới đây vẫn là số đo cũ
          # trên qwen2.5:3b-instruct. Đổi model hoặc hạ tầng thì BẮT BUỘC hiệu
          # chuẩn lại bảng này bằng eval/run_eval.py thật trên model mới trước
          # khi khóa chạy — SPEC-SCOPE-03. Không tự suy ra số mới từ suy đoán.
          GATES = {
              "accuracy":            0.70,
              "macro_f1":            0.65,
              "recall_at_5":         0.75,
              "escalation_recall":   0.90,
              "adversarial_pass":    1.00,
          }

          r = json.loads(Path("eval/results/ci.json").read_text(encoding="utf-8"))
          profile = r["manifest"]["config_profile"]
          cls = r["classification"]["classification"]
          ret = r.get("retrieval") or {}
          saf = r["classification"]["safety"]
          adv = r.get("adversarial") or {}

          actual = {
              "accuracy":          cls.get("accuracy"),
              "macro_f1":          cls.get("macro_f1"),
              "recall_at_5":       ret.get("recall_at_5"),
              "escalation_recall": saf.get("escalation_recall"),
              "adversarial_pass":  adv.get("pass_rate"),
          }

          print(f"Cổng chất lượng · cấu hình {profile}")
          failed = []
          for name, floor in GATES.items():
              got = actual.get(name)
              if got is None:
                  print(f"  [BỎ QUA] {name:<20} không đo được")
                  continue
              ok = got >= floor
              print(f"  [{'ĐẠT' if ok else 'CHẶN'}] {name:<20} {got:.3f}  (ngưỡng {floor})")
              if not ok:
                  failed.append(f"{name}={got:.3f} < {floor}")

          if failed:
              print()
              print("MERGE BỊ CHẶN — chất lượng tụt dưới ngưỡng:")
              for line in failed:
                  print(f"  {line}")
              print()
              print("Đây là cổng chặn thật, không phải cảnh báo. Sửa chất lượng rồi đẩy lại.")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.cache_check.outputs.has_cache == 'true'
        with:
          name: eval-report
          path: eval/results/ci.json

  # ── Giai đoạn 4 — Dựng ảnh ─────────────────────── bật từ Session 5 ──────
  build:
    name: 4 · Dựng ảnh
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dựng ảnh ứng dụng
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: csc-ai-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Nhánh cứu hộ ────────────────────────────────────────────────────────
  # Nhánh cứu hộ không được kiểm thử là nhánh cứu hộ hỏng — và nó sẽ hỏng đúng
  # lúc một nhóm cần dùng, giữa buổi, không có thời gian sửa.
  rescue-branches:
    name: Nhánh cứu hộ còn dùng được
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        session: [1, 2, 3, 4, 5, 6]
    steps:
      # Không dùng `ref:` của actions/checkout — nó hỏng ở bước setup khi nhánh
      # chưa tồn tại, trước khi bất kỳ bước nào của ta chạy được. Sáu nhánh cứu
      # hộ chỉ ra đời ở giai đoạn P6, nên trước đó job này phải BỎ QUA sạch sẽ
      # chứ không làm CI đỏ vĩnh viễn.
      - uses: actions/checkout@v4
      - name: Nhánh solution/session-${{ matrix.session }} đã tồn tại chưa
        id: probe
        run: |
          BRANCH="solution/session-${{ matrix.session }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Chưa có $BRANCH::Nhánh cứu hộ sinh ở giai đoạn P6"
            echo "Nhánh $BRANCH chưa tồn tại — bỏ qua."
            echo ""
            echo "Sinh bằng: uv run python scripts/make_starter.py --all"
            echo "Xem docs/KE-HOACH-XAY-DUNG.md, giai đoạn P6."
          fi
      - uses: actions/checkout@v4
        if: steps.probe.outputs.exists == 'true'
        with:
          ref: solution/session-${{ matrix.session }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v3
        if: steps.probe.outputs.exists == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Kiểm thử tới lab ${{ matrix.session }}
        if: steps.probe.outputs.exists == 'true'
        run: |
          uv sync --all-extras
          MARKERS="lab0"
          for i in $(seq 1 ${{ matrix.session }}); do
            MARKERS="$MARKERS or lab$i"
          done
          echo "Chạy: pytest -m \"$MARKERS\""
          uv run pytest -q -m "$MARKERS"
