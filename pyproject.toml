[project]
name = "csc-ai-assistant"
version = "0.6.0"
description = "Trợ lý xử lý ticket CSKH viễn thông — Starter Kit môn AI-Native Application Engineering"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.36,<2",
    "chromadb>=0.5,<0.6",
    "mlflow>=2.14,<3",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    # Ghim ĐÚNG phiên bản, không dùng khoảng. `.pre-commit-config.yaml` cũng
    # ghim v0.5.7. Ruff bổ sung và gỡ quy tắc giữa các phiên bản phụ, nên một
    # khoảng phiên bản khiến máy học viên và CI báo lỗi khác nhau — và không gì
    # làm mất niềm tin vào cổng chất lượng nhanh bằng "máy tôi xanh mà CI đỏ".
    "ruff==0.5.7",
    "pre-commit>=3.7,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# SPEC-TOOLING-03 — chuẩn viết mã được ép tự động, không dựa vào ý thức
# ---------------------------------------------------------------------------
[tool.ruff]
# 110 thay vì 100 là lựa chọn có chủ ý. Docstring và chú thích trong dự án này
# viết bằng tiếng Việt, và câu tiếng Việt có dấu dài hơn tiếng Anh cùng nghĩa
# khoảng 15-20%. Ép 100 khiến chú thích bị ngắt giữa câu, và chú thích khó đọc
# thì không ai đọc — mất luôn phần giá trị lớn nhất của mã nguồn dạy học.
line-length = 110
target-version = "py311"
exclude = [".cache", "data/index_prebuilt", "eval/mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "D"]
ignore = [
    "D203",   # xung đột với D211
    "D213",   # xung đột với D212
    "ANN401", # cho phép Any ở ranh giới JSON
    "D104",   # __init__.py không bắt buộc docstring
    "ANN101", # không chú thích kiểu cho `self` — quy tắc đã lỗi thời và bị gỡ
              # ở các phiên bản ruff sau; giữ lại chỉ tạo nhiễu, không tạo giá trị
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D"]
# Hai module dưới đây là DỮ LIỆU, không phải mã: 120 ticket viết tay kèm nhãn
# và ghi chú lý do gán nhãn. Ngắt dòng nội dung ticket cho vừa giới hạn làm
# chúng khó đọc và khó rà soát hơn hẳn, mà rà soát nhãn mới là việc quan trọng.
"scripts/tickets_train_data.py" = ["E501"]
"scripts/tickets_test_data.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "lab0: kiểm tra môi trường",
    "lab1: Canvas và phạm vi",
    "lab2: kiến trúc và ADR",
    "lab3: prompt, cấu trúc đầu ra, truy hồi",
    "lab4: workflow, tool calling, human-in-the-loop",
    "lab5: API, guardrails, đánh giá, logging",
    "lab6: cải tiến, model card, bàn giao",
    "needs_llm: cần máy chủ suy luận thật, bỏ qua khi chỉ có cache",
]
